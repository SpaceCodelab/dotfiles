set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

set -g status-interval 1
set -g status on
set -g status-justify left
set -g status-bg "default"
set -g status-fg "#cdd6f4"

set -g status-left-length 80
set -g status-right-length 200

# --- FIX: remove default green highlight ---
set -g window-status-format "#I:#W"
set -g window-status-current-format "#I:#W"
setw -g window-status-style "fg=default,bg=default,none"
setw -g window-status-current-style "fg=default,bg=default,none"
set -g status-style "bg=default"

# --- keep your UI ---
set -g window-status-separator ""

set -g pane-border-style "fg=#1f1f1f"
set -g pane-active-border-style "fg=#333333"
set -g message-style "fg=#b3b3b3,bg=#1a1a1a"
set -g mode-style "fg=#0d0d0d,bg=#555555"

# --- LEFT (rounded grey pill) ---
set -g status-left ""
set -ag status-left "#[fg=#cdd6f4,bg=#313244]"
set -ag status-left "#[fg=#cdd6f4,bg=#313244]  #S "
set -ag status-left "#[fg=#313244,bg=default] "

# --- RIGHT ---
set -g status-right ""

set -ag status-right "#[fg=#cdd6f4,bg=#313244]"
set -ag status-right "#[fg=#cdd6f4,bg=#313244]  %H:%M "
set -ag status-right "#[fg=#313244,bg=default] "

set -ag status-right "#[fg=#cdd6f4,bg=#313244]"
set -ag status-right "#[fg=#cdd6f4,bg=#313244]  #{b:pane_current_path} "
set -ag status-right "#[fg=#313244,bg=default] "

set -ag status-right "#[fg=#cdd6f4,bg=#313244]"
set -ag status-right "#[fg=#cdd6f4,bg=#313244]  #(git branch --show-current 2>/dev/null) "
set -ag status-right "#[fg=#313244,bg=default] "

set -ag status-right "#[fg=#cdd6f4,bg=#313244]"
set -ag status-right "#[fg=#cdd6f4,bg=#313244]  #(cut -d' ' -f1-2 /proc/loadavg) "
set -ag status-right "#[fg=#313244,bg=default] "
