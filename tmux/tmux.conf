# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start counting from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Terminal
set -g default-terminal "tmux-256color"

# Performance
set -sg escape-time 10
set -g history-limit 50000

# Mouse
set -g mouse on

# Vim motions
setw -g mode-keys vi

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Reloaded!"

# Splits open in current directory
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Vim pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind Tab next-window
bind BSpace previous-window

# Quick session detach
bind q detach-client

# Status bar
set -g status-position bottom
set -g status-interval 5

set -g status-style "bg=#0a0a0a,fg=#c0caf5"
set -g pane-border-style "fg=#24283b"
set -g pane-active-border-style "fg=#7aa2f7"

set -g status-left ""
set -g status-right "#[fg=#7aa2f7]%H:%M #[fg=#bb9af7]%d %b"

set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "

# Copy mode
bind [ copy-mode
